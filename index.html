<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#08090b"><title>Ares</title><style>
:root{--bg:#08090b;--surface:#111318;--surface2:#171a20;--line:#292d36;--text:#f5f7fa;--muted:#8e96a3;--accent:#d7ff45}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.3 system-ui,-apple-system,sans-serif}.app{max-width:620px;margin:auto;padding:20px 13px 35px}.header{display:flex;align-items:center;gap:11px;margin-bottom:20px}.appIcon{width:46px;height:46px;border-radius:13px;background:linear-gradient(145deg,#1b1d22,#0d0f13);border:1px solid #343842;display:grid;place-items:center;box-shadow:0 5px 18px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.05);color:var(--accent)}.appIcon svg{width:28px;height:28px;display:block;filter:drop-shadow(0 2px 4px color-mix(in srgb,var(--accent) 35%,transparent))}.brand h1{font-size:25px;margin:0 0 3px;line-height:1}.brand .date{font-size:14px;color:var(--muted)}.weekNav{display:grid;grid-template-columns:43px 1fr 43px;align-items:center;margin-bottom:10px}.arrow{width:43px;height:43px;border:0;border-radius:13px;background:var(--surface);color:var(--muted);font-size:24px}.range{text-align:center;color:var(--muted);font-size:15px}.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:19px}.dayTile{height:68px;border:0;border-radius:15px;background:var(--surface);color:var(--muted);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}.dayTile .dow{font-size:10px}.dayTile .num{font-size:19px;font-weight:800;color:var(--text)}.dayTile.selected{background:var(--accent);color:#10120d}.dayTile.selected .num{color:#10120d}.dot{display:none}.summary{background:var(--surface);border-radius:20px;padding:21px 19px;display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}.eyebrow{font-size:12px;color:var(--muted);letter-spacing:.08em;margin-bottom:6px}.summary h2{font-size:25px;line-height:1.05;letter-spacing:-.04em;margin:0;max-width:350px}.ring{width:70px;height:70px;border-radius:50%;background:conic-gradient(var(--accent) var(--p),var(--surface2) 0);position:relative;display:grid;place-items:center;flex:none}.ring:after{content:"";position:absolute;inset:7px;border-radius:50%;background:var(--surface)}.ring span{position:relative;z-index:1;font-size:16px;font-weight:800}.exercise{background:var(--surface);border-radius:20px;padding:16px 18px;margin:8px 0;display:flex;align-items:center;justify-content:space-between;gap:10px}.exerciseInfo{min-width:0}.exerciseName{font-size:19px;font-weight:750;letter-spacing:-.025em;line-height:1.08}.prescription{font-size:13px;color:var(--muted);margin-top:5px}.setDots{display:flex;gap:6px;flex:none}.setBtn{width:38px;height:38px;border:1px solid var(--line);border-radius:11px;background:var(--surface2);color:transparent;font-size:15px;display:grid;place-items:center}.setBtn.done{background:var(--accent);color:#10120d}.setBtn.locked{opacity:.35;cursor:not-allowed}.bottom{display:flex;gap:8px;margin-top:12px}.bottom button{flex:1;border:0;border-radius:12px;background:var(--surface);color:var(--text);padding:11px;font-size:13px}.modalBack{position:fixed;inset:0;background:rgba(0,0,0,.68);display:none;align-items:flex-end;z-index:5}.modalBack.open{display:flex}.sheet{width:100%;max-width:620px;margin:auto;background:var(--surface);border-radius:22px 22px 0 0;padding:20px 17px calc(20px + env(safe-area-inset-bottom))}.handle{width:36px;height:4px;border-radius:99px;background:var(--line);margin:0 auto 16px}.sheet h3{margin:0;font-size:20px}.sheet .target{color:var(--muted);margin:4px 0 15px}.fields{display:grid;grid-template-columns:1fr 1fr;gap:8px}.fields label{font-size:11px;color:var(--muted)}.fields input{display:block;width:100%;margin-top:5px;background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:11px;color:var(--text);font-size:14px}.sheetActions{display:flex;gap:8px;margin-top:12px}.sheetActions button{flex:1;border:0;border-radius:11px;padding:12px;font-size:14px}.cancel{background:var(--surface2);color:var(--text)}.complete{background:var(--accent);color:#10120d;font-weight:800}.historyTitle{font-size:25px;margin:0 0 12px}.historyItem{background:var(--surface);border-radius:15px;padding:13px;margin:7px 0}.historyItem b{font-size:15px}.historyItem span{display:block;color:var(--muted);margin-top:2px}@media(max-width:430px){.app{padding:17px 11px 30px}.exerciseName{font-size:17px}.setBtn{width:35px;height:40px}.setDots{gap:5px}.summary h2{font-size:22px}.ring{width:64px;height:64px}.dayTile{height:70px}.dayTile .num{font-size:20px}}
</style></head><body><main class="app"><header class="header"><div class="appIcon" aria-label="Ares dumbbell logo"><svg viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg"><rect x="4" y="11" width="4" height="10" rx="1.5" fill="currentColor"/><rect x="24" y="11" width="4" height="10" rx="1.5" fill="currentColor"/><rect x="8" y="9" width="3.5" height="14" rx="1.5" fill="currentColor"/><rect x="20.5" y="9" width="3.5" height="14" rx="1.5" fill="currentColor"/><path d="M11 15.25H21" stroke="currentColor" stroke-width="3.5" stroke-linecap="round"/></svg></div><div class="brand"><h1>Ares</h1><div class="date" id="date"></div></div></header><div id="main"></div></main><script>
const W={Saturday:["Rest Day",[["Walk 10K Steps",1,"10,000 steps"]]],Sunday:["Rest Day",[["Walk 10K Steps",1,"10,000 steps"]]],Monday:["Push + Core",[["Resistance Band Chest Press",3,"8–15"],["Resistance Band Fly",3,"12–15"],["Push-ups",3,"8–15"],["Band Shoulder Press",3,"8–12"],["Band Lateral Raise",3,"12–20"],["Band Triceps Pushdown",3,"10–15"],["Overhead Band Triceps Extension",2,"12–15"],["Reverse Crunch",3,"12–15"],["Plank",3,"30–60 sec"]]],Tuesday:["Pull + Core",[["Resistance Band Lat Pulldown",3,"8–15"],["Band Row",3,"8–15"],["Band Straight-Arm Pulldown",3,"12–15"],["Band Face Pull",3,"12–20"],["Band Reverse Fly",3,"12–15"],["Band Biceps Curl",3,"8–15"],["Band Hammer Curl",2,"10–15"],["Dead Bug",3,"10–12 / side"],["Bicycle Crunch",3,"12–20 / side"]]],Wednesday:["Legs + Core",[["Band Squat",4,"8–15"],["Bulgarian Split Squat",3,"8–12 / leg"],["Band Reverse Lunge",3,"10–12 / leg"],["Band Romanian Deadlift",4,"8–15"],["Band Glute Bridge",3,"12–20"],["Standing Calf Raise",3,"15–25"],["Leg Raise",3,"10–15"],["Plank",3,"40–60 sec"],["Mountain Climbers",3,"30–45 sec"]]],Thursday:["Full Body + Core",[["Band Squat",3,"10–15"],["Band Chest Press",3,"10–15"],["Band Lat Pulldown",3,"10–15"],["Band Romanian Deadlift",3,"10–15"],["Band Shoulder Press",3,"10–15"],["Band Biceps Curl",2,"12–15"],["Band Triceps Pushdown",2,"12–15"],["Reverse Crunch",3,"12–15"],["Russian Twist",3,"12–20"],["Plank",2,"45–60 sec"]]],Friday:["Full Body + Core",[["Bulgarian Split Squat",3,"8–12 / leg"],["Band Chest Press / Push-ups",3,"10–15"],["Band Row",3,"10–15"],["Band RDL",3,"10–15"],["Band Lateral Raise",3,"15–20"],["Band Face Pull",3,"15–20"],["Band Hammer Curl",2,"10–15"],["Overhead Band Triceps Extension",2,"10–15"],["Leg Raise",3,"10–15"],["Dead Bug",3,"10 / side"]]]};
const days=["Monday","Tuesday","Wednesday","Thursday","Friday","Saturday","Sunday"],store="ares-log-v5";const dayColors={Monday:"#ff3b30",Tuesday:"#14c8c4",Wednesday:"#34c759",Thursday:"#a855f7",Friday:"#ff9500",Saturday:"#3b82f6",Sunday:"#ec4899"};let day=localStorage.getItem("ares-day")||days[(new Date().getDay()+6)%7];if(!W[day])day="Monday";let weekOffset=0;const get=()=>JSON.parse(localStorage.getItem(store)||"{}"),put=x=>localStorage.setItem(store,JSON.stringify(x)),K=(d,e,i)=>d+"|"+e+"|"+i;
function baseMonday(){const now=new Date(),m=new Date(now);m.setHours(0,0,0,0);m.setDate(now.getDate()-((now.getDay()+6)%7));return m}function dateForDay(d){const idx=days.indexOf(d),m=baseMonday();m.setDate(m.getDate()+weekOffset*7);const x=new Date(m);x.setDate(m.getDate()+idx);return x}function isToday(d){return weekOffset===0&&dateForDay(d).toDateString()===new Date().toDateString()}function weekDates(){const m=baseMonday();m.setDate(m.getDate()+weekOffset*7);return days.map((d,i)=>{const x=new Date(m);x.setDate(m.getDate()+i);return{d,n:x.getDate(),m:x.toLocaleDateString(undefined,{month:"short"})}})}
function render(){document.documentElement.style.setProperty("--accent",dayColors[day]||"#737b88");const s=get(),w=W[day],total=w[1].reduce((a,x)=>a+x[1],0);let done=0;w[1].forEach(e=>{for(let i=1;i<=e[1];i++)if(s[K(day,e[0],i)]?.done)done++});const dates=weekDates(),sel=dates.find(x=>x.d===day)||dates[0],pct=total?Math.round(done/total*100):0;document.getElementById("date").textContent=sel.d+" "+sel.n+" "+sel.m;let h="<div class='weekNav'><button class='arrow' onclick='changeWeek(-1)'>‹</button><div class='range'>"+dates[0].n+" "+dates[0].m+" – "+dates[6].n+" "+dates[6].m+"</div><button class='arrow' onclick='changeWeek(1)'>›</button></div><div class='week'>";dates.forEach(x=>h+="<button class='dayTile "+(x.d===day?"selected":"")+"' onclick='pick("+JSON.stringify(x.d)+")'><span class='dow'>"+x.d.slice(0,3).toUpperCase()+"</span><span class='num'>"+x.n+"</span></button>");h+="</div><section class='summary'><div><div class='eyebrow'>"+day.toUpperCase()+"</div><h2>"+w[0]+"</h2></div><div class='ring' style='--p:"+pct+"%'><span>"+pct+"%</span></div></section>";if(!w[1].length){h+="<section class='exercise'><div class='exerciseInfo'><div class='exerciseName'>Rest Day</div><div class='prescription'>Recovery • No workout scheduled</div></div></section>"}w[1].forEach(e=>{h+="<section class='exercise'><div class='exerciseInfo'><div class='exerciseName'>"+e[0]+"</div><div class='prescription'>"+(e[0]==='Walk 10K Steps'?e[2]:e[1]+' × '+e[2])+"</div></div><div class='setDots'>";for(let i=1;i<=e[1];i++){const v=s[K(day,e[0],i)]||{},locked=!isToday(day);h+="<button class='setBtn "+(v.done?"done ":"")+(locked?"locked":"")+"' "+(locked?"disabled":"onclick='toggleSet("+JSON.stringify(e[0])+","+i+")'")+">"+(v.done?"✓":"")+"</button>"}h+="</div></section>"});document.getElementById("main").innerHTML=h}
function changeWeek(delta){weekOffset+=delta;day=weekDates()[Math.min(Math.max(days.indexOf(day),0),6)].d;render()}function pick(d){day=d;localStorage.setItem("ares-day",d);render()}function toggleSet(ex,i){const s=get(),k=K(day,ex,i);s[k]={...(s[k]||{}),done:!(s[k]?.done)};put(s);render()}
render();
</script></body></html>
