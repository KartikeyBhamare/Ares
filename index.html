<!doctype html>
<html><head><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#08090b"><title>Ares</title>
<style>
:root{--bg:#08090b;--surface:#111318;--surface2:#171a20;--line:#292d36;--text:#f5f7fa;--muted:#8e96a3;--accent:#d7ff45}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.35 Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}.app{max-width:650px;margin:auto;padding:28px 16px calc(42px + env(safe-area-inset-bottom))}.header{display:flex;align-items:center;gap:14px;margin-bottom:30px}.appIcon{width:58px;height:58px;border-radius:17px;background:var(--accent);display:grid;place-items:center;color:#10120d;font-size:31px;font-weight:900}.brand h1{font-size:30px;line-height:1;margin:0 0 7px;letter-spacing:-.04em}.brand .date{font-size:17px;color:var(--muted)}.weekNav{display:grid;grid-template-columns:58px 1fr 58px;align-items:center;margin-bottom:15px}.arrow{width:58px;height:58px;border:0;border-radius:17px;background:var(--surface);color:var(--muted);font-size:30px}.range{text-align:center;color:var(--muted);font-size:18px}.week{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-bottom:30px}.dayTile{height:105px;border:0;border-radius:22px;background:var(--surface);color:var(--muted);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px}.dayTile .dow{font-size:16px;font-weight:500}.dayTile .num{font-size:28px;font-weight:800;color:var(--text)}.dayTile.selected{background:var(--accent);color:#10120d}.dayTile.selected .num{color:#10120d}.dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}.summary{background:var(--surface);border-radius:28px;padding:30px 28px;display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}.eyebrow{font-size:15px;color:var(--muted);letter-spacing:.08em;margin-bottom:9px}.summary h2{font-size:31px;line-height:1.05;letter-spacing:-.045em;margin:0;max-width:390px}.ring{width:94px;height:94px;border-radius:50%;background:conic-gradient(var(--accent) var(--p),var(--surface2) 0);position:relative;flex:none;display:grid;place-items:center}.ring:after{content:"";position:absolute;inset:9px;border-radius:50%;background:var(--surface)}.ring span{position:relative;z-index:1;font-size:20px;font-weight:800}.exercise{background:var(--surface);border-radius:28px;padding:24px 28px;margin:12px 0;display:flex;align-items:center;justify-content:space-between;gap:15px}.exerciseInfo{min-width:0}.exerciseName{font-size:26px;font-weight:750;letter-spacing:-.035em;line-height:1.08}.prescription{font-size:17px;color:var(--muted);margin-top:8px}.setDots{display:flex;gap:10px;flex:none}.setBtn{width:54px;height:54px;border:0;border-radius:15px;background:var(--surface2);color:transparent;font-size:18px}.setBtn.done{background:var(--accent);color:#10120d}.bottom{display:flex;gap:10px;margin-top:18px}.bottom button{flex:1;border:0;border-radius:16px;background:var(--surface);color:var(--text);padding:15px;font-size:15px}.modalBack{position:fixed;inset:0;background:rgba(0,0,0,.68);display:none;align-items:flex-end;z-index:5}.modalBack.open{display:flex}.sheet{width:100%;max-width:650px;margin:auto;background:var(--surface);border-radius:28px 28px 0 0;padding:24px 20px calc(25px + env(safe-area-inset-bottom))}.handle{width:42px;height:5px;border-radius:99px;background:var(--line);margin:0 auto 20px}.sheet h3{margin:0;font-size:23px}.sheet .target{color:var(--muted);margin:5px 0 18px}.fields{display:grid;grid-template-columns:1fr 1fr;gap:10px}.fields label{font-size:12px;color:var(--muted)}.fields input{display:block;width:100%;margin-top:6px;background:var(--surface2);border:1px solid var(--line);border-radius:13px;padding:13px;color:var(--text);font-size:16px}.sheetActions{display:flex;gap:9px;margin-top:15px}.sheetActions button{flex:1;border:0;border-radius:14px;padding:14px;font-size:15px}.cancel{background:var(--surface2);color:var(--text)}.complete{background:var(--accent);color:#10120d;font-weight:800}.historyTitle{font-size:30px;margin:0 0 15px}.historyItem{background:var(--surface);border-radius:18px;padding:17px;margin:9px 0}.historyItem b{font-size:17px}.historyItem span{display:block;color:var(--muted);margin-top:3px}@media(max-width:520px){.app{padding:24px 14px 35px}.week{gap:7px}.dayTile{height:94px;border-radius:19px}.dayTile .dow{font-size:14px}.dayTile .num{font-size:25px}.weekNav{grid-template-columns:52px 1fr 52px}.arrow{width:52px;height:52px}.summary{padding:25px 22px;border-radius:24px}.summary h2{font-size:27px}.ring{width:84px;height:84px}.exercise{padding:20px 19px;border-radius:24px}.exerciseName{font-size:21px}.prescription{font-size:15px}.setDots{gap:7px}.setBtn{width:43px;height:54px;border-radius:13px}}
</style></head>
<body><main class="app">
<header class="header"><div class="appIcon">↔</div><div class="brand"><h1>Ares</h1><div class="date" id="date"></div></div></header>
<div id="main"></div>
</main>
<div class="modalBack" id="modal" onclick="closeModal(event)"><div class="sheet" onclick="event.stopPropagation()"><div class="handle"></div><h3 id="modalTitle"></h3><div class="target" id="modalTarget"></div><div class="fields"><label>Reps / seconds<input id="reps" inputmode="decimal" type="number"></label><label>Weight / note<input id="note" type="text" placeholder="Optional"></label></div><div class="sheetActions"><button class="cancel" onclick="closeModal()">Cancel</button><button class="complete" onclick="completeSet()">Complete set</button></div></div></div>
<script>
const W={Monday:["Push + Core",[["Resistance Band Chest Press",3,"8–15"],["Resistance Band Fly",3,"12–15"],["Push-ups",3,"8–15"],["Band Shoulder Press",3,"8–12"],["Band Lateral Raise",3,"12–20"],["Band Triceps Pushdown",3,"10–15"],["Overhead Band Triceps Extension",2,"12–15"],["Reverse Crunch",3,"12–15"],["Plank",3,"30–60 sec"]]],Tuesday:["Pull + Core",[["Resistance Band Lat Pulldown",3,"8–15"],["Band Row",3,"8–15"],["Band Straight-Arm Pulldown",3,"12–15"],["Band Face Pull",3,"12–20"],["Band Reverse Fly",3,"12–15"],["Band Biceps Curl",3,"8–15"],["Band Hammer Curl",2,"10–15"],["Dead Bug",3,"10–12 / side"],["Bicycle Crunch",3,"12–20 / side"]]],Wednesday:["Legs + Core",[["Band Squat",4,"8–15"],["Bulgarian Split Squat",3,"8–12 / leg"],["Band Reverse Lunge",3,"10–12 / leg"],["Band Romanian Deadlift",4,"8–15"],["Band Glute Bridge",3,"12–20"],["Standing Calf Raise",3,"15–25"],["Leg Raise",3,"10–15"],["Plank",3,"40–60 sec"],["Mountain Climbers",3,"30–45 sec"]]],Thursday:["Full Body + Core",[["Band Squat",3,"10–15"],["Band Chest Press",3,"10–15"],["Band Lat Pulldown",3,"10–15"],["Band Romanian Deadlift",3,"10–15"],["Band Shoulder Press",3,"10–15"],["Band Biceps Curl",2,"12–15"],["Band Triceps Pushdown",2,"12–15"],["Reverse Crunch",3,"12–15"],["Russian Twist",3,"12–20"],["Plank",2,"45–60 sec"]]],Friday:["Full Body + Core",[["Bulgarian Split Squat",3,"8–12 / leg"],["Band Chest Press / Push-ups",3,"10–15"],["Band Row",3,"10–15"],["Band RDL",3,"10–15"],["Band Lateral Raise",3,"15–20"],["Band Face Pull",3,"15–20"],["Band Hammer Curl",2,"10–15"],["Overhead Band Triceps Extension",2,"10–15"],["Leg Raise",3,"10–15"],["Dead Bug",3,"10 / side"]]]};
const days=Object.keys(W),store="ares-log-v5";let day=localStorage.getItem("ares-day")||days[(new Date().getDay()+6)%7];if(!W[day])day="Monday";let active=null;
const get=()=>JSON.parse(localStorage.getItem(store)||"{}"),put=x=>localStorage.setItem(store,JSON.stringify(x)),K=(d,e,i)=>d+"|"+e+"|"+i;
function weekDates(){const now=new Date(),m=new Date(now);m.setDate(now.getDate()-((now.getDay()+6)%7));return days.map((d,i)=>{const x=new Date(m);x.setDate(m.getDate()+i);return {d,n:x.getDate(),m:x.toLocaleDateString(undefined,{month:"short"}),date:x}})}
function render(){
 const s=get(),w=W[day],total=w[1].reduce((a,x)=>a+x[1],0);let done=0;w[1].forEach(e=>{for(let i=1;i<=e[1];i++)if(s[K(day,e[0],i)]?.done)done++});
 const dates=weekDates(),sel=dates.find(x=>x.d===day)||dates[0],pct=Math.round(done/total*100);
 document.getElementById("date").textContent=sel.d+" "+sel.n+" "+sel.m;
 let h="<div class='weekNav'><button class='arrow'>‹</button><div class='range'>"+dates[0].n+" "+dates[0].m+" – "+dates[4].n+" "+dates[4].m+"</div><button class='arrow'>›</button></div><div class='week'>";
 dates.forEach(x=>{h+="<button class='dayTile "+(x.d===day?"selected":"")+"' onclick='pick("+JSON.stringify(x.d)+")'><span class='dow'>"+x.d.slice(0,3).toUpperCase()+"</span><span class='num'>"+x.n+"</span><span class='dot'></span></button>"});h+="</div>";
 h+="<section class='summary'><div><div class='eyebrow'>"+day.toUpperCase()+"</div><h2>"+w[0]+"</h2></div><div class='ring' style='--p:"+pct+"%'><span>"+pct+"%</span></div></section>";
 w[1].forEach(e=>{h+="<section class='exercise'><div class='exerciseInfo'><div class='exerciseName'>"+e[0]+"</div><div class='prescription'>"+e[1]+" × "+e[2]+"</div></div><div class='setDots'>";for(let i=1;i<=e[1];i++){const v=s[K(day,e[0],i)]||{};h+="<button class='setBtn "+(v.done?"done":"")+"' onclick='openSet("+JSON.stringify(e[0])+","+i+")'>"+(v.done?"✓":"")+"</button>"}h+="</div></section>"});
 h+="<div class='bottom'><button onclick='resetDay()'>Reset day</button><button onclick='showHistory()'>History</button></div>";document.getElementById("main").innerHTML=h;
}
function pick(d){day=d;localStorage.setItem("ares-day",d);render()}
function openSet(ex,i){active={ex,i};const v=get()[K(day,ex,i)]||{};document.getElementById("modalTitle").textContent=ex+" · Set "+i;const e=W[day][1].find(x=>x[0]===ex);document.getElementById("modalTarget").textContent="Target: "+e[2];document.getElementById("reps").value=v.reps||"";document.getElementById("note").value=v.note||"";document.getElementById("modal").classList.add("open");setTimeout(()=>document.getElementById("reps").focus(),80)}
function closeModal(e){if(e&&e.target!==e.currentTarget)return;document.getElementById("modal").classList.remove("open");active=null}
function completeSet(){if(!active)return;const s=get(),k=K(day,active.ex,active.i);s[k]={...(s[k]||{}),reps:document.getElementById("reps").value,note:document.getElementById("note").value,done:true};put(s);closeModal();render()}
function resetDay(){if(confirm("Reset all "+day+" sets?")){const s=get();Object.keys(s).filter(k=>k.startsWith(day+"|")).forEach(k=>delete s[k]);put(s);render()}}
function showHistory(){const s=get();let h="<h2 class='historyTitle'>History</h2>",any=false;days.forEach(d=>{const total=W[d][1].reduce((a,x)=>a+x[1],0);let n=0;W[d][1].forEach(e=>{for(let i=1;i<=e[1];i++)if(s[K(d,e[0],i)]?.done)n++});if(n){any=true;h+="<div class='historyItem'><b>"+d+"</b><span>"+n+" / "+total+" sets completed</span></div>"}});if(!any)h+="<div class='historyItem'>No completed sets yet.</div>";h+="<div class='bottom'><button onclick='render()'>Back to workout</button></div>";document.getElementById("main").innerHTML=h}
render();
</script></body></html>
