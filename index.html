<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#08090b"><title>ARES Workout Log</title><style>
:root{--b:#08090b;--c:#111318;--c2:#181b21;--l:#292d36;--t:#f5f7fa;--m:#8e96a3;--a:#d7ff45}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% -10%,#20252d,var(--b) 38%);color:var(--t);font:15px/1.4 system-ui,-apple-system,sans-serif}.app{max-width:620px;margin:auto;padding:20px 14px 70px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}.brand{font-size:25px;font-weight:900;letter-spacing:.1em}.m{color:var(--m);font-size:12px}.days{display:flex;gap:7px;overflow:auto;margin-bottom:12px}.days button{border:1px solid var(--l);background:var(--c);color:var(--m);padding:9px 14px;border-radius:99px;white-space:nowrap}.days .on{background:var(--a);color:#090a0b;border-color:var(--a);font-weight:800}.hero,.ex,.hist{background:var(--c);border:1px solid var(--l);border-radius:17px}.hero{padding:17px;margin-bottom:12px}.hero h1{margin:0;font-size:24px}.barbg{height:7px;background:#252932;border-radius:9px;margin:13px 0 7px;overflow:hidden}.bar{height:100%;background:var(--a)}.stats{display:flex;justify-content:space-between}.ex{margin:9px 0;overflow:hidden}.eh{padding:14px;display:flex;justify-content:space-between}.en{font-weight:750}.sets{border-top:1px solid var(--l);padding:9px}.set{display:grid;grid-template-columns:39px 1fr 1fr 40px;gap:7px;align-items:center;margin:6px 0}.set input{min-width:0;width:100%;background:var(--c2);border:1px solid var(--l);color:var(--t);border-radius:9px;padding:10px 8px}.set button{height:39px;border:1px solid var(--l);border-radius:9px;background:var(--c2);color:var(--m);font-size:18px}.done button{background:var(--a);color:#090a0b;border-color:var(--a)}.done input{border-color:#315c34}.check{color:var(--a);font-size:11px;font-weight:800}.acts{display:flex;gap:8px;margin-top:12px}.acts button{flex:1;background:var(--c);border:1px solid var(--l);color:var(--t);border-radius:11px;padding:12px}.hist{padding:15px;margin:9px 0}.empty{text-align:center;color:var(--m);padding:35px}@media(max-width:430px){.set{grid-template-columns:32px 1fr 1fr 39px}.set input{font-size:13px}}
</style></head><body><main class="app"><header class="top"><div><div class="brand">ARES</div><div class="m">WORKOUT LOG</div></div><div class="m" id="date"></div></header><nav class="days" id="days"></nav><div id="app"></div></main><script>
const W={
Monday:["Push + Core",[["Resistance Band Chest Press",3,"8–15"],["Resistance Band Fly",3,"12–15"],["Push-ups",3,"8–15"],["Band Shoulder Press",3,"8–12"],["Band Lateral Raise",3,"12–20"],["Band Triceps Pushdown",3,"10–15"],["Overhead Band Triceps Extension",2,"12–15"],["Reverse Crunch",3,"12–15"],["Plank",3,"30–60 sec"]]],
Tuesday:["Pull + Core",[["Resistance Band Lat Pulldown",3,"8–15"],["Band Row",3,"8–15"],["Band Straight-Arm Pulldown",3,"12–15"],["Band Face Pull",3,"12–20"],["Band Reverse Fly",3,"12–15"],["Band Biceps Curl",3,"8–15"],["Band Hammer Curl",2,"10–15"],["Dead Bug",3,"10–12 / side"],["Bicycle Crunch",3,"12–20 / side"]]],
Wednesday:["Legs + Core",[["Band Squat",4,"8–15"],["Bulgarian Split Squat",3,"8–12 / leg"],["Band Reverse Lunge",3,"10–12 / leg"],["Band Romanian Deadlift",4,"8–15"],["Band Glute Bridge",3,"12–20"],["Standing Calf Raise",3,"15–25"],["Leg Raise",3,"10–15"],["Plank",3,"40–60 sec"],["Mountain Climbers",3,"30–45 sec"]]],
Thursday:["Full Body + Core",[["Band Squat",3,"10–15"],["Band Chest Press",3,"10–15"],["Band Lat Pulldown",3,"10–15"],["Band Romanian Deadlift",3,"10–15"],["Band Shoulder Press",3,"10–15"],["Band Biceps Curl",2,"12–15"],["Band Triceps Pushdown",2,"12–15"],["Reverse Crunch",3,"12–15"],["Russian Twist",3,"12–20"],["Plank",2,"45–60 sec"]]],
Friday:["Full Body + Core",[["Bulgarian Split Squat",3,"8–12 / leg"],["Band Chest Press / Push-ups",3,"10–15"],["Band Row",3,"10–15"],["Band RDL",3,"10–15"],["Band Lateral Raise",3,"15–20"],["Band Face Pull",3,"15–20"],["Band Hammer Curl",2,"10–15"],["Overhead Band Triceps Extension",2,"10–15"],["Leg Raise",3,"10–15"],["Dead Bug",3,"10 / side"]]]
};
const D=Object.keys(W),store="ares-log-v3";let day=localStorage.getItem("ares-day")||D[(new Date().getDay()+6)%7];if(!W[day])day="Monday";document.getElementById("date").textContent=new Date().toLocaleDateString(undefined,{day:"numeric",month:"short"});
const get=()=>JSON.parse(localStorage.getItem(store)||"{}"),put=x=>localStorage.setItem(store,JSON.stringify(x)),K=(d,e,i)=>d+"|"+e+"|"+i;
function esc(x){return String(x??"").replaceAll("&","&amp;").replaceAll('"',"&quot;").replaceAll("<","&lt;")}
function render(){
 const s=get(),w=W[day],total=w[1].reduce((a,x)=>a+x[1],0);let done=0;
 w[1].forEach(e=>{for(let i=1;i<=e[1];i++)if(s[K(day,e[0],i)]?.done)done++});
 document.getElementById("days").innerHTML=D.map(d=>"<button class='"+(d==day?"on":"")+"' onclick='pick("+JSON.stringify(d)+")'>"+d.slice(0,3).toUpperCase()+"</button>").join("");
 let h="<section class='hero'><h1>"+day+"</h1><div class='m'>"+w[0]+" · "+done+"/"+total+" sets</div><div class='barbg'><div class='bar' style='width:"+done/total*100+"%'></div></div><div class='stats m'><span>"+Math.round(done/total*100)+"% complete</span><span>"+total+" total sets</span></div></section>";
 w[1].forEach(e=>{let ed=0;for(let i=1;i<=e[1];i++)if(s[K(day,e[0],i)]?.done)ed++;h+="<section class='ex'><div class='eh'><div><div class='en'>"+e[0]+"</div><div class='m'>"+e[1]+" sets · "+e[2]+"</div></div><div class='check'>"+(ed==e[1]?"DONE":"")+"</div></div><div class='sets'>";
 for(let i=1;i<=e[1];i++){let v=s[K(day,e[0],i)]||{};h+="<div class='set "+(v.done?"done":"")+"'><span class='m'>"+i+"</span><input type='number' inputmode='decimal' placeholder='"+(e[2].includes("sec")?"seconds":"reps")+"' value='"+esc(v.reps)+"' onchange='saveField("+JSON.stringify(e[0])+","+i+","reps",this.value)'><input placeholder='Weight / note' value='"+esc(v.note)+"' onchange='saveField("+JSON.stringify(e[0])+","+i+","note",this.value)'><button onclick='toggle("+JSON.stringify(e[0])+","+i+")'>"+(v.done?"✓":"○")+"</button></div>"}
 h+="</div></section>"});
 h+="<div class='acts'><button onclick='resetDay()'>Reset "+day+"</button><button onclick='history()'>History</button></div>";document.getElementById("app").innerHTML=h;
}
function pick(d){day=d;localStorage.setItem("ares-day",d);render()}
function saveField(e,i,f,v){let s=get(),k=K(day,e,i);s[k]={...(s[k]||{}),[f]:v};put(s)}
function toggle(e,i){let s=get(),k=K(day,e,i);s[k]={...(s[k]||{}),done:!(s[k]?.done)};put(s);render()}
function resetDay(){if(confirm("Reset all "+day+" sets?")){let s=get();Object.keys(s).filter(k=>k.startsWith(day+"|")).forEach(k=>delete s[k]);put(s);render()}}
function history(){let s=get(),h="<section class='hero'><h1>History</h1><div class='m'>Saved on this device</div></section>",any=false;D.forEach(d=>{let t=W[d][1].reduce((a,x)=>a+x[1],0),n=0;W[d][1].forEach(e=>{for(let i=1;i<=e[1];i++)if(s[K(d,e[0],i)]?.done)n++});if(n){any=true;h+="<div class='hist'><b>"+d+"</b><div class='m'>"+n+" / "+t+" sets completed</div></div>"}});if(!any)h+="<div class='empty'>No completed sets yet.<br>Time to suffer productively. 😈</div>";h+="<div class='acts'><button onclick='render()'>Back</button></div>";document.getElementById("app").innerHTML=h}
render();
</script></body></html>
